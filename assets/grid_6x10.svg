<svg xmlns="http://www.w3.org/2000/svg" width="600mm" height="1000mm" viewBox="0 0 600 1000">
  <title>6열 10행 투명 촉각 격자 시제품</title>
  <desc>키오스크 화면 위에 맞춰 사용할 수 있는 A부터 F, 1부터 10까지의 격자 도안</desc>
  <rect x="1" y="1" width="598" height="998" fill="none" stroke="#111827" stroke-width="3"/>
  <g stroke="#111827" stroke-width="2" stroke-dasharray="8 5">
    <line x1="100" y1="0" x2="100" y2="1000"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="300" y1="0" x2="300" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="500" y1="0" x2="500" y2="1000"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
    <line x1="0" y1="700" x2="600" y2="700"/>
    <line x1="0" y1="800" x2="600" y2="800"/>
    <line x1="0" y1="900" x2="600" y2="900"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" opacity="0.8">
    <text x="12" y="30">A</text><text x="112" y="30">B</text>
    <text x="212" y="30">C</text><text x="312" y="30">D</text>
    <text x="412" y="30">E</text><text x="512" y="30">F</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#111827" opacity="0.8">
    <text x="8" y="92">1</text><text x="8" y="192">2</text>
    <text x="8" y="292">3</text><text x="8" y="392">4</text>
    <text x="8" y="492">5</text><text x="8" y="592">6</text>
    <text x="8" y="692">7</text><text x="8" y="792">8</text>
    <text x="8" y="892">9</text><text x="8" y="992">10</text>
  </g>
  <g fill="#111827">
    <circle cx="7" cy="7" r="5"/><circle cx="593" cy="7" r="5"/>
    <circle cx="593" cy="993" r="5"/><circle cx="7" cy="993" r="5"/>
  </g>
</svg>

